# API + Web contra una base SQL Server REMOTA (MonsterASP.NET), sin contenedor de SQL Server local.
#
#   $env:REMOTE_DB_PASSWORD = "<contraseña de la base>"      # PowerShell
#   docker compose -f docker-compose.remote.yml up -d --build
#
# La contraseña NUNCA va en este archivo ni en el repositorio: se lee del entorno.
services:
  api:
    build:
      context: ./backend
    container_name: puntoreclamo-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=${REMOTE_DB_HOST:-db73455.public.databaseasp.net},1433;Database=${REMOTE_DB_NAME:-db73455};User Id=${REMOTE_DB_USER:-db73455};Password=${REMOTE_DB_PASSWORD:?Defina REMOTE_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Admin__ApiKey: ${ADMIN_API_KEY:?Defina ADMIN_API_KEY}
      Admin__Username: ${ADMIN_USERNAME:?Defina ADMIN_USERNAME}
      Admin__Password: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY (mín. 32 caracteres)}
      Cors__AllowedOrigins__0: http://localhost:3000
      Database__ApplyMigrationsOnStartup: "true"
      Database__Seed: "true"
      Swagger__Enabled: "true"
    ports:
      - "5017:8080"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5017
    container_name: puntoreclamo-web
    depends_on:
      - api
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"
